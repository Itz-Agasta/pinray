[package]
name = "pinray-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# docs.rs builders have no system libpipewire, so the linux-target build
# fails in libspa-sys. All modules here are private — the public API is
# identical in the non-linux stub — so docs are built on a target without
# native deps.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
pinray-core = { path = "../core", version = "0.1" }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
x11rb = { version = "0.13", features = ["randr", "xfixes"] }
zbus = { version = "5.15", default-features = true }
