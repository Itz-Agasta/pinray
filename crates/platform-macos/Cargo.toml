[package]
name = "pinray-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Build docs for the real macOS implementation (objc2 crates compile for
# darwin targets from the linux docs.rs builder).
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[dependencies]
pinray-core = { path = "../core", version = "0.2" }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent"] }
