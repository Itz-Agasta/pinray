[workspace]
members = [
    "crates/core",
    "crates/platform-linux",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/pinray",
]
resolver = "3"

[workspace.package]
description = "Multi-platform screen capture library for Rust"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Itz-Agasta/pinray"
version = "0.2.4"
# let-chains (stabilized 1.88) are used throughout
rust-version = "1.88"
keywords = ["screen-capture", "screenshot", "recording", "screencast", "audio"]
categories = ["multimedia", "multimedia::video", "os"]

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
