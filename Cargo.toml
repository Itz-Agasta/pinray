[workspace]
members = [
  "crates/core",
  "crates/platform-linux",
  "crates/platform-macos",
  "crates/platform-windows",
  "crates/pinray",
]
resolver = "3"

[workspace.package]
description = "Cross-platform screen capture and recording with system audio for Rust: raw frames with timestamps, stride, and pixel format from native backends (Wayland/PipeWire, X11, ScreenCaptureKit, DXGI/WGC, WASAPI)"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Itz-Agasta/pinray"
version = "0.2.8"
# let-chains (stabilized 1.88) are used throughout
rust-version = "1.88"
keywords = ["screen-capture", "screen-recording", "audio-capture", "wayland", "screencast"]
categories = [
  "multimedia::video",
  "multimedia::audio",
  "os::linux-apis",
  "os::macos-apis",
  "os::windows-apis",
]

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
